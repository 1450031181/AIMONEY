# 多因子增强策略默认参数（CLI --params 可覆盖）
#
# 注意：回测必须显式提供因子，否则策略会因读不到因子值而报错：
#   aimoney-backtest --factors mom_20,vol_20 ...
factors:
  - mom_20
  - vol_20

# 各因子权重；留空或删除本项表示等权（截面标准化后等权是合理的基线）
weights: null

# 持仓只数（每只等权，总仓位在下方配置）
top_k: 3

# 调仓间隔（交易日）；越短换手越高，成本吃掉越多 IC
rebalance_interval: 5

# 总目标仓位（留现金以应对费用与滑点）
total_weight: 0.95

# 低于该得分不买（null 表示不启用）
min_score: null

# 缺任一必需因子的标的直接跳过（拿 0 顶替会造出假的"中性"信号）
require_all_factors: true

# ---- 组合层（默认全部关闭 = 等权满仓的朴素行为）----
# 分配方案：equal（等权）/ score（按得分加权，负分标的排除）/ rank（按排名）/ inverse_vol（逆波动率）
weight_scheme: equal

# 单标的上限与碎仓下限（null / 0 = 不启用）；上限截断后会把多余权重重新分配，不会偷偷变成现金
max_weight: null
min_weight: 0.0

# 权重变化小于该值就不交易（抑制无效换手，代价是略微偏离理想权重）
no_trade_band: 0.0

# 单次调仓换手上限（null = 不限制）。注意换手口径是 0.5×Σ|Δw|，清仓 = 50%
max_turnover: null

# inverse_vol 方案估算波动率用的窗口
volatility_window: 20
