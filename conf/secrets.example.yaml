# 敏感配置模板：复制为 conf/secrets.yaml 后填写（该文件已被 .gitignore 排除，严禁入库）
#
# 加密方式（AES-256-GCM，主密钥来自环境变量 AIMONEY_MASTER_KEY）：
#   1) 生成主密钥：  python -m app.core.crypto keygen
#   2) 设置环境变量：$env:AIMONEY_MASTER_KEY = "<上一步输出>"
#   3) 加密明文：    python -m app.core.crypto encrypt "你的券商账号"
#   4) 把输出的 enc:v1:... 字符串填入下面的字段
#
# 程序读取时会自动解密带 "enc:v1:" 前缀的值；明文值（如本地开发的模拟盘）原样返回。

data_source:
  tushare_token: ""
  akshare: {}

broker:
  # 一期默认模拟盘，无需任何密钥
  mode: simulated      # simulated / qmt / ptrade
  qmt:
    account_id: ""
    password: ""
    mini_path: ""      # miniQMT 安装目录，如 C:/国金QMT交易端/userdata_mini
  ptrade:
    account_id: ""
    password: ""

notify:
  dingtalk_webhook: ""
  wecom_webhook: ""
